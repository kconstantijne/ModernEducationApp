<!doctype html>
<html lang="uk">

<head>
<link rel="icon" type="image/svg+xml" href="../assets/app-icon.svg"/>
<link rel="apple-touch-icon" href="../assets/app-icon.png"/>
<link rel="manifest" href="../manifest.webmanifest"/>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <title>Вхід — Навчальна лабораторія</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth-page.js"></script>
</head>

<body class="auth-page">
    <main class="auth-card"><a class="auth-brand" href="../index.html" style="color:inherit;text-decoration:none"><span
                class="brand-mark"><svg aria-hidden="true" viewbox="0 0 40 40">
                    <rect fill="currentColor" height="32" opacity=".13" rx="11" width="32" x="4" y="4"></rect>
                    <path d="M12 24 20 10l8 14M15 20h10M13 29h14" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"></path>
                </svg></span><span>Навчальна лабораторія</span></a>
        <h1>Раді бачити знову!</h1>
        <p class="auth-intro">Увійди, щоб продовжити навчання та синхронізувати свій прогрес.</p>
        <form class="auth-form" id="loginForm"><label>Електронна пошта<input id="email" type="email"
                    autocomplete="email" required placeholder="you@example.com"></label><label>Пароль<input
                    id="password" type="password" autocomplete="current-password" required minlength="6"
                    placeholder="Щонайменше 6 символів"></label><button class="auth-button"
                type="submit">Увійти</button><button class="auth-secondary" id="googleLogin" type="button">Продовжити з
                Google</button></form>
        <div class="auth-feedback" id="authFeedback" aria-live="polite"></div>
        <div class="auth-links"><a href="register.html">Створити профіль</a><a href="#" id="resetPassword">Забули
                пароль?</a></div>
    </main>
</body>

</html>
