<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <title>Реєстрація — Навчальна лабораторія</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth-page.js"></script>
</head>

<body class="auth-page">
    <main class="auth-card"><a class="auth-brand" href="../index.html" style="color:inherit;text-decoration:none"><span
                class="brand-mark"><svg aria-hidden="true" viewbox="0 0 40 40">
                    <rect fill="currentColor" height="32" opacity=".13" rx="11" width="32" x="4" y="4"></rect>
                    <path d="M12 24 20 10l8 14M15 20h10M13 29h14" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"></path>
                </svg></span><span>Навчальна лабораторія</span></a>
        <h1>Створи свій профіль</h1>
        <p class="auth-intro">Збережи результати уроків, досягнення та комп’юшки у своєму акаунті.</p>
        <form class="auth-form" id="registerForm"><label>Як тебе називати?<input id="displayName" type="text"
                    maxlength="48" autocomplete="name" required
                    placeholder="Ім’я або псевдонім"></label><label>Електронна пошта<input id="email" type="email"
                    autocomplete="email" required placeholder="you@example.com"></label><label>Пароль<input
                    id="password" type="password" autocomplete="new-password" minlength="6" required
                    placeholder="Щонайменше 6 символів"></label><button class="auth-button" type="submit">Створити
                профіль</button><button class="auth-secondary" id="googleLogin" type="button">Зареєструватися через
                Google</button></form>
        <div class="auth-feedback" id="authFeedback" aria-live="polite"></div>
        <div class="auth-links"><a href="login.html">Уже маєш профіль? Увійти</a><a href="../index.html">На головну</a>
        </div>
    </main>
</body>

</html>
