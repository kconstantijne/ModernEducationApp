<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Кабінет учителя — Навчальна лабораторія</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/firebase-config.js"></script>
    <script type="module" src="../js/teacher-dashboard.js"></script>
</head>

<body class="auth-page">
    <main class="auth-card" style="width:min(100%,1000px)"><a class="auth-brand" href="../index.html"
            style="color:inherit;text-decoration:none"><span class="brand-mark"><svg aria-hidden="true"
                    viewbox="0 0 40 40">
                    <rect fill="currentColor" height="32" opacity=".13" rx="11" width="32" x="4" y="4"></rect>
                    <path d="M12 24 20 10l8 14M15 20h10M13 29h14" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"></path>
                </svg></span><span>Навчальна лабораторія</span></a>
        <h1>Кабінет учителя</h1>
        <p class="auth-intro">Огляд навчальних профілів і прогресу. Доступ до списку учнів відкриється лише для акаунта
            з роллю teacher.</p>
        <div class="account-actions"><a class="account-chip" href="../index.html">← На головну</a><button
                class="account-chip" id="refreshStudents" type="button">Оновити</button><button class="account-chip"
                id="exportCsv" type="button" disabled>Експорт CSV</button></div>
        <p class="auth-feedback" id="teacherFeedback" aria-live="polite">Перевіряємо авторизацію…</p>
        <div class="teacher-table-wrap">
            <table class="teacher-table">
                <thead>
                    <tr>
                        <th>Учень</th>
                        <th>Клас</th>
                        <th>Завершено уроків</th>
                        <th>Комп’юшки</th>
                        <th>Оновлено</th>
                    </tr>
                </thead>
                <tbody id="studentRows">
                    <tr>
                        <td colspan="5">Завантаження…</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
